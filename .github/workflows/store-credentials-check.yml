# Check the store-publish credentials WITHOUT publishing anything.
#
# release.yml has no dry-run input on purpose: a release dispatch is a decision
# to ship. But the ten secrets and the EDGE_API_KEY_ISSUED variable it reads
# cannot be validated by GitHub (it only stores them), and the first hint that
# one is wrong would otherwise be a failed upload minutes after a real release
# has already tagged, attested and published to GitHub. This workflow runs the
# same preflight and the same publishers in --dry-run mode against the same
# secrets, so an operator can confirm a credential rotation from the Actions
# tab before it matters.
#
# What --dry-run actually checks, per store (see scripts/publish/*.mjs):
#   * chrome  — mints a REAL OAuth access token from CWS_REFRESH_TOKEN and calls
#               :fetchStatus. Read-only, but it proves the client ID, client
#               secret, refresh token, publisher ID and item ID work together.
#   * edge    — credential presence plus the EDGE_API_KEY_ISSUED countdown.
#               The key itself is not exercised; the first real call is the
#               real publish.
#   * firefox — credential presence only.
#
# A Chrome dry run spends a refresh-token round trip. While the OAuth consent
# screen is in "Testing" that token lives 7 days, so do not put this on a
# schedule — run it after a rotation, or before a release you are unsure about.
#
# Unlike store-publish, this job is NOT continue-on-error: a red run is the
# whole point.

name: store-credentials-check

on:
  workflow_dispatch:
    inputs:
      stores:
        description: "Which store credentials to check."
        required: false
        default: all
        type: choice
        options:
          - all
          - chrome
          - edge
          - firefox

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    # Same environment as release.yml's store-publish job, so the secrets
    # resolve identically and any protection rule added there gates this too.
    environment: store-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The dry run refuses to start without the built zips (it checks the
      # artifact exists before touching a store), so build exactly as the
      # release does.
      - name: Pin SOURCE_DATE_EPOCH to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct HEAD)" >> "$GITHUB_ENV"

      # scripts/lib/creds.mjs redacts every secret from anything the scripts
      # print — these logs are public.
      - name: Preflight and dry-run publish
        id: dryrun
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_API_KEY_ISSUED: ${{ vars.EDGE_API_KEY_ISSUED }}
          EDGE_EXTENSION_ID: ${{ vars.EDGE_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish.mjs --store=${{ inputs.stores || 'all' }} --dry-run

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Store credentials check — \`${{ inputs.stores || 'all' }}\`"
            echo ""
            if [ -f dist/publish-report.json ]; then
              node -e '
                const r = require("./dist/publish-report.json");
                for (const s of r.results ?? []) {
                  console.log(`- ${s.ok ? "ok" : "FAILED"}: ${s.store}${s.message ? " — " + s.message : ""}`);
                }
              '
              echo ""
              echo "Nothing was uploaded. \"ok\" for chrome means a real token was minted and the item was reachable; for edge and firefox it means the credentials are present, not that the store accepted them."
            else
              echo "Preflight failed before any store was contacted — the missing or expired credential is named in the job log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
