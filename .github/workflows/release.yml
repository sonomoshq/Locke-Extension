# ═══════════════════════════════════════════════════════════════════════
#  Release. Publishing is a DELIBERATE, MANUAL ACT: this workflow runs on
#  `workflow_dispatch` and nothing else. Merging to `main` no longer ships
#  anything — a human opens Actions → Release → "Run workflow" on `main`
#  and means it.
#
#  It publishes only when this repository has no release tag for the
#  version in `manifest.json` (scripts/release-gate.mjs). Re-dispatching on
#  a version that has already shipped publishes nothing and stays green, so
#  running this workflow to look at it is safe.
#
#  To release: merge the version bump (`npm run bump -- patch`) and the
#  changelog entry, then dispatch this workflow on `main`.
#
#  Dispatch-only is NOT an approval gate and must not be described as one.
#  One person still both authorises and ships; what changed is that
#  shipping is now a separate, deliberate action rather than a side effect
#  of merging. See docs/security/RELEASE-POLICY.md.
#
#  Step names in this file are load-bearing. RELEASE-POLICY.md and
#  ASVS-MAPPING.md cite `release.yml::Validate version matches manifest`,
#  `release.yml::Build extension zip (reproducible)` and
#  `release.yml::Sign artifacts` verbatim. Don't rename them.
# ═══════════════════════════════════════════════════════════════════════

name: Release

on:
  # workflow_dispatch ONLY, and deliberately no `push:` (Sonomos #190). A push
  # trigger here makes merging the publish action, which is what this file was
  # changed to stop. tests/release-gate.test.js asserts that no workflow in
  # this repository pairs a push trigger with a store publish.
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even though this version already has a release tag. That is what a run which reached store-publish leaves behind, so this is for re-driving a failed publish — not for shipping the same bytes twice. It does NOT let a release be built from a branch other than main."
        required: false
        default: false
        type: boolean
      stores:
        description: "Which stores to publish to."
        required: false
        default: all
        type: choice
        options: [all, chrome, edge, firefox]

permissions:
  contents: read

concurrency:
  # Serialise releases. Never cancel one in flight: a cancelled publish can
  # leave one store updated and two behind, which is worse than slow.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ── Decide whether this dispatch is a release ────────────────────────
  #
  # Cheap, always runs, and is the only thing standing between a click and
  # three public review queues.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      # fetch-depth: 0 — the gate asks whether this repository already has a
      # release tag for the manifest's version, so it needs the WHOLE tag set.
      # A shallow checkout would hand it a partial one, where "no tag for this
      # version" means "I could not look" rather than "not released";
      # scripts/release-gate.mjs detects that case and refuses to publish, so
      # shrinking this back to a shallow fetch turns every release into a
      # --force. Depth 0 is what makes the ordinary answer trustworthy.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ref-name is passed because dispatch, unlike the push trigger this
      # replaced, lets the operator choose the branch. The gate refuses any ref
      # but `main` — including under --force — because the sigstore identity
      # RELEASE-POLICY.md tells verifiers to check is pinned to
      # `release.yml@refs/heads/main`.
      - name: Decide whether to publish
        id: decide
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/release-gate.mjs --force "--ref-name=$REF_NAME"
          else
            node scripts/release-gate.mjs "--ref-name=$REF_NAME"
          fi

      - name: Say so in the run summary
        run: |
          {
            echo "### Release gate"
            echo ""
            echo "- version: \`${{ steps.decide.outputs.version }}\`"
            echo "- publish: \`${{ steps.decide.outputs.publish }}\`"
            echo "- reason: ${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Build, sign, attest, publish the GitHub release ──────────────────
  release:
    name: release
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag, the GitHub release and its assets
      id-token: write # sigstore keyless OIDC + provenance
      attestations: write # actions/attest-build-provenance
    outputs:
      version: ${{ needs.gate.outputs.version }}
      tag: v${{ needs.gate.outputs.version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate version matches manifest
        run: node scripts/preflight.mjs --checks=version

      - name: Unit tests (node:test)
        run: npm test

      - name: Preflight (manifest, assets)
        run: node scripts/preflight.mjs --checks=manifest,assets

      # RELEASE-POLICY.md "Reproducible builds": SOURCE_DATE_EPOCH is pinned
      # to this commit's committer time, so rebuilding from the same commit
      # gives byte-identical zips. Note the LICENCE limits who may act on
      # that: it grants no right to build, so reproducibility is a property
      # Sonomos verifies internally and publishes the recipe for.
      - name: Pin SOURCE_DATE_EPOCH to the release commit
        run: |
          epoch="$(git log -1 --pretty=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "commit $(git rev-parse HEAD)"
          echo "SOURCE_DATE_EPOCH=$epoch ($(date -u -d "@$epoch" '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: Build extension zip (reproducible)
        run: |
          npm run package
          ls -l dist/
        # scripts/package.mjs stages through scripts/store-build.mjs and
        # writes with the deterministic ZIP writer in scripts/zip.mjs:
        #   dist/locke-extension-<version>-chromium.zip  (Chrome + Edge)
        #   dist/locke-extension-<version>-firefox.zip   (AMO)

      - name: sha256 sidecars
        working-directory: dist
        run: |
          for f in *.zip; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Generate SBOMs (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOMs (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SECURITY.md A5: keyless OIDC signing binds each artifact to this
      # source commit and this workflow invocation. Verifiers run
      #   cosign verify-blob --bundle <artifact>.sigstore.bundle \
      #     --certificate-identity-regexp '...release\.yml@refs/heads/main' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Note the identity is now refs/heads/main, not a tag ref: releases are
      # built from main rather than from a signed tag.
      - name: Sign artifacts
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in *.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.bundle" "$f"
            echo "signed $f -> $f.sigstore.bundle"
          done

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ needs.gate.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.sigstore.bundle
            dist/sbom.*.json
          if-no-files-found: error
          retention-days: 90

      # The tag is created here rather than being a precondition, because the
      # trigger is a dispatch on a branch. It is a lightweight tag made by CI —
      # NOT the human-signed tag the old tag-driven flow required, and
      # `--verify-tag` is correspondingly gone. RELEASE-POLICY.md records
      # that the signed-tag control no longer applies.
      #
      # This tag is also the gate's evidence: scripts/release-gate.mjs reads the
      # tag set to answer "has this version already been released?", so this
      # step is what makes a second dispatch on the same version a no-op.
      #
      # Idempotent: re-running a release for a version that already has a
      # tag must not fail the run. (Reaching here twice for one version means
      # --force was used, which is exactly the re-drive case.)
      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.gate.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists locally"
          elif gh api "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists on the remote"
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="${{ github.sha }}"
            echo "created $tag at ${{ github.sha }}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.gate.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — uploading assets to it"
            gh release upload "$tag" --clobber \
              dist/*.zip dist/*.sha256 dist/*.sigstore.bundle \
              dist/sbom.cyclonedx.json dist/sbom.spdx.json
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              dist/*.zip \
              dist/*.sha256 \
              dist/*.sigstore.bundle \
              dist/sbom.cyclonedx.json \
              dist/sbom.spdx.json
          fi

  # ── Store publication ────────────────────────────────────────────────
  #
  # NO APPROVAL GATE. Once a human has dispatched the workflow, this runs
  # automatically as soon as `release` succeeds — the dispatch is the only
  # human decision in the chain, and it is taken before the build, not after
  # it. Nobody reviews the artifacts between building them and submitting
  # them to three stores.
  #
  # The job still targets the `store-publish` GitHub Environment, for two
  # reasons worth keeping even without reviewers:
  #   1. Every store credential is scoped to that environment, so a job that
  #      is not this one cannot read them.
  #   2. Adding required reviewers to that environment in repo settings
  #      re-introduces the approval gate with no change to this file. If you
  #      do that, update RELEASE-POLICY.md so the docs stay true.
  #
  # A publish is not reversible the way a GitHub release is: Chrome and Edge
  # submissions enter review queues, and a version cannot be re-uploaded.
  store-publish:
    name: store-publish
    needs: [gate, release]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: store-publish
    # A store outage, an expired credential or a rejected submission must not
    # turn `main` red. The build, the signatures, the attestation and the
    # GitHub release have already succeeded by this point and are what `main`'s
    # health actually depends on; whether a third-party API accepted an upload
    # five minutes later is a different question, and one this repository does
    # not control.
    #
    # So this job reports its own outcome and does NOT fail the run. The
    # failure is not swallowed: it is written to the run summary, uploaded as a
    # report, and raised as an issue by the job below.
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Rebuild rather than download: the build is reproducible by
      # construction, so rebuilding from the same commit is a free check
      # that what we publish is what this commit makes.
      - name: Pin SOURCE_DATE_EPOCH to the release commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct HEAD)" >> "$GITHUB_ENV"

      # scripts/publish.mjs runs preflight itself (including `credentials`)
      # and uploads to every selected store, writing per-store status to
      # dist/publish-report.json. scripts/lib/creds.mjs redacts every secret
      # from anything it prints — these logs are public.
      #
      # --yes skips the interactive abort window, which has no meaning on a
      # runner with no terminal attached.
      - name: Publish to Chrome Web Store, Edge Add-ons and AMO
        id: publish
        continue-on-error: true
        env:
          # Chrome Web Store (API v2).
          # CWS_REFRESH_TOKEN expires after 7 DAYS while the OAuth consent
          # screen is in Testing. Unattended publishing will break weekly
          # until that screen is published. See docs/store/CREDENTIALS.md.
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          # Edge Add-ons (API v1.1) — EDGE_API_KEY expires every 72 days,
          # with no server-side warning.
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Set to the ISO date the Edge key was generated, and update it on
          # every rotation. It is the only way preflight can warn before the
          # 72-day expiry lands mid-release.
          EDGE_API_KEY_ISSUED: ${{ vars.EDGE_API_KEY_ISSUED }}
          EDGE_EXTENSION_ID: ${{ vars.EDGE_EXTENSION_ID }}
          # Firefox AMO (API v5)
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish.mjs --store=${{ inputs.stores || 'all' }} --yes

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-report-v${{ needs.gate.outputs.version }}
          path: dist/publish-report.json
          if-no-files-found: warn
          retention-days: 90

      # A partial publish is the failure mode that matters: three stores,
      # three independent APIs, and no transaction across them. Say which
      # succeeded and which did not, in the run summary, so nobody has to
      # open an artifact to find out.
      - name: Summarise what shipped
        if: always()
        run: |
          {
            echo "### Store publication — v${{ needs.gate.outputs.version }}"
            echo ""
            if [ -f dist/publish-report.json ]; then
              node -e '
                const r = require("./dist/publish-report.json");
                const rows = Array.isArray(r) ? r : (r.stores ?? r.results ?? []);
                if (!rows.length) { console.log("Report present but no per-store rows were found."); }
                for (const s of rows) {
                  const name = s.label ?? s.store ?? "(unknown)";
                  const ok = s.ok ?? s.success ?? (s.status === "ok");
                  const mark = s.status === "skipped" ? "skipped" : ok ? "shipped" : "FAILED";
                  console.log(`- ${mark}: ${name}${s.message ? " — " + s.message : ""}`);
                }
                if (r.releaseNotes === false) {
                  console.log("");
                  console.log("**No release notes were sent.** The CHANGELOG section for this version was empty or held only the bump placeholder; AMO and Edge reviewers saw none.");
                }
              '
            else
              echo "No publish report was written — the publish step did not get far enough."
            fi
            echo ""
            echo "A store may have shipped while another failed; they are independent."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Tell someone when a store publish failed ─────────────────────────
  #
  # `store-publish` deliberately does not fail the run, so without this the
  # only trace of a failed upload would be a green tick and an artifact
  # nobody opens. This job turns that into an issue.
  #
  # It runs whenever a publish was attempted, and decides from the recorded
  # outcome rather than from its own success.
  publish-failure-notice:
    name: publish-failure-notice
    needs: [gate, store-publish]
    if: >-
      always() && needs.gate.outputs.publish == 'true' &&
      (needs.store-publish.result != 'success' ||
       needs.store-publish.outputs.outcome != 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Store publish failed for v${VERSION}"

          # Plain echo, not a heredoc: a heredoc terminator has to sit at
          # column 0, and a column-0 line would end this YAML block scalar.
          # --body-file keeps the markdown out of argv entirely.
          body="$RUNNER_TEMP/publish-failure.md"
          {
            echo "The build for v${VERSION} succeeded and the GitHub release exists,"
            echo "but publishing to one or more stores did not succeed."
            echo ""
            echo "**main is fine.** This is a publishing failure, not a build failure."
            echo "The branch is not blocked and further merges are safe."
            echo ""
            echo "- Run: ${RUN_URL}"
            echo "- Per-store detail: the run summary, and the publish-report-v${VERSION} artifact."
            echo ""
            echo "Common causes, in the order they actually happen:"
            echo ""
            echo "1. CWS_REFRESH_TOKEN expired. It lasts **7 days** while the Google"
            echo "   OAuth consent screen is in Testing. This is the most likely cause."
            echo "2. EDGE_API_KEY expired. It lasts **72 days**, with no warning."
            echo "3. A store rejected the submission on review grounds."
            echo "4. That version was already uploaded to that store."
            echo ""
            echo "To re-drive only the store that failed, run the Release workflow"
            echo "manually with force: true and stores set to that one store. Do not"
            echo "re-run the whole publish: a store that already accepted v${VERSION}"
            echo "will reject it."
          } > "$body"

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
