# ═══════════════════════════════════════════════════════════════════════
#  The only live trigger in this file is `workflow_dispatch`. The push,
#  pull_request and schedule triggers are written out below but COMMENTED
#  OUT.
#
#  docs/security/ASVS-MAPPING.md 12.1.1 and CONTROL-CATALOG.md cite this
#  file as the Semgrep SAST control; RELEASE-POLICY.md lists "Semgrep
#  SAST" as a required status check on `main`.
# ═══════════════════════════════════════════════════════════════════════

name: Semgrep

on:
  workflow_dispatch:
  # Enabled on transfer to the public repository: Actions minutes are
  # free on public repos, which was the only reason these were dormant.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      # SECURITY.md A4: semgrep is pinned to an exact release rather than
      # `latest`, so an upstream tag move cannot silently change what CI
      # enforces. Bumping this is a deliberate PR.
      #
      # No third-party ACTION is used here (semgrep/semgrep-action is
      # deprecated in favour of running the CLI); the container image is
      # the whole dependency.
      image: semgrep/semgrep:1.124.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rule packs per CONTRIBUTING.md "Testing": p/javascript, p/browser,
      # p/secrets. Findings fail the job (`--error`), which is the point of
      # listing this as a required check.
      - name: Semgrep scan
        run: |
          # Two passes on purpose: the semgrep CLI emits ONE output format
          # per invocation. The first pass writes SARIF for the artifact and
          # never fails the job; the second prints human-readable findings to
          # the log and is the pass that gates the build (--error).
          semgrep scan \
            --config p/javascript \
            --config p/browser \
            --config p/secrets \
            --metrics=off \
            --sarif --output semgrep.sarif || true
          semgrep scan \
            --config p/javascript \
            --config p/browser \
            --config p/secrets \
            --metrics=off \
            --error

      - name: Upload SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      # To land findings in the Code Scanning dashboard, replace (or
      # supplement) the artifact upload above with
      # `github/codeql-action/upload-sarif`. That needs `security-events:
      # write` on this job and code scanning enabled for the repository;
      # until then the SARIF is an artifact.
